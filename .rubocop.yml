plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable

# This is quatsch
Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 5
